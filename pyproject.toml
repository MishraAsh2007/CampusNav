[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-routing"
version = "0.1.0"
description = "Stateless, closure-aware UMass Amherst walking routes"
requires-python = ">=3.11"
# Runtime dependencies for the Data API (backend.main) and the routing engine (campus_routing).
# Keep in sync with requirements.txt, which Vercel and pip users can install from directly.
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "networkx>=3.4,<4",
  "shapely>=2.1,<3", "pyproj>=3.7,<4", "httpx>=0.28,<1", "tzdata>=2024.1",
  "pymongo>=4.11,<5", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
build = ["osmnx>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
pipeline = [
  "beautifulsoup4>=4.12,<5", "openpyxl>=3.1,<4", "pypdf>=6,<7",
  "google-genai>=1,<3", "python-dotenv>=1,<2", "pymupdf>=1.24,<2",
]
scraper = ["playwright>=1.51,<2"]
data = ["pymongo>=4.11,<5", "python-dotenv>=1,<2"]

# Vercel (FastAPI preset, Root Directory ./): serve routing and the shared Data API together.
# The project root stays on the import path for campus_routing, campus_notices, and data/.
[tool.vercel]
entrypoint = "campus_routing.integrated:app"

[tool.setuptools.packages.find]
include = ["campus_routing*", "campus_notices*", "backend*"]

[tool.setuptools.package-data]
campus_routing = ["*.html"]
backend = ["closures.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
